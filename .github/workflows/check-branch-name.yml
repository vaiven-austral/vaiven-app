name: Check branch name
on:
  push:
    branches-ignore:
      - main
jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar nombre de rama
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ ! "$BRANCH_NAME" =~ ^SCRUM-[0-9]+ ]]; then
            echo "❌ El nombre de la rama '$BRANCH_NAME' no empieza con SCRUM-<número>."
            exit 1
          fi
          echo "✅ Nombre de rama correcto."