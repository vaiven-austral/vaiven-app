name: Pedir Review al Bot
on:
  pull_request:
    types: [review_requested]

jobs:
  avisar-bot:
    if: github.event.requested_reviewer.login == 'vaivendev'
    runs-on: ubuntu-latest
    steps:
      - name: Tocar timbre en vaivendev
        run: |
          gh api repos/vaiven-austral/vaivendev/actions/workflows/revisar-pr.yml/dispatches \
            -f ref=main \
            -f inputs[pr]=${{ github.event.pull_request.number }} \
            -f inputs[sha]=${{ github.event.pull_request.head.sha }} \
            -f inputs[base]=${{ github.event.pull_request.base.ref }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_VAIVEN_REVIEW }}